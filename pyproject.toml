[project]
name = "skm"
version = "0.2.0"
description = "SKM-2PO measurement/communication mechanism: protocol core + measurement GUI (standalone)"
requires-python = "==3.14.9"
dependencies = [
    "numpy==2.5.4",
    "pyqtgraph==0.14.0",
    "pyside6==6.12.0",
    "sounddevice==0.5.6",  # TonePlayer engine (in-process), same pin as tone-player
]

[dependency-groups]
dev = ["ruff==0.17.1"]
build = ["pyinstaller==6.22.3"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "S", "B", "N"]

[tool.ruff.lint.per-file-ignores]
"src/**" = ["N802"]

[tool.ruff.lint.pep8-naming]
# CamelCase override names, required by Qt (Qt event overrides).
ignore-names = [
    "paintEvent",
    "mouseReleaseEvent",
    "mousePressEvent",
    "mouseDoubleClickEvent",
    "contextMenuEvent",
    "enterEvent",
    "leaveEvent",
    "wheelEvent",
    "keyPressEvent",
    "closeEvent",
    "setUp",
    "setUpClass",
    "focusInEvent",
    "focusOutEvent",
]
