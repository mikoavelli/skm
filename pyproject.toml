[project]
name = "skm"
version = "0.1.0"
description = "Механизм замеров СКМ-2ПО: core-модуль протокола + измерительный GUI (standalone)"
requires-python = "==3.14.9"
dependencies = ["numpy==2.5.4", "pyqtgraph==0.14.0", "pyside6==6.12.0"]

[dependency-groups]
dev = ["ruff==0.17.1"]
build = ["pyinstaller==6.22.3"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "S", "B", "N"]

[tool.ruff.lint.per-file-ignores]
"src/**" = ["N802"]

[tool.ruff.lint.pep8-naming]
# CamelCase override names, required by Qt (перекрытия событий Qt).
ignore-names = [
    "paintEvent",
    "mouseReleaseEvent",
    "mousePressEvent",
    "mouseDoubleClickEvent",
    "contextMenuEvent",
    "enterEvent",
    "leaveEvent",
    "wheelEvent",
    "keyPressEvent",
    "closeEvent",
    "setUp",
    "setUpClass",
    "focusInEvent",
    "focusOutEvent",
]
